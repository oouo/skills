version: 8

output_system:
  validated_canvas_px:
    width: 1086
    height: 1448
  color_space: sRGB
  format: PNG
  profile_reference_px:
    width: 196
    height: 261
    columns: 3
  sequence: newest-to-oldest
  text_composition: deterministic-after-visual-generation
  visible_text_allowlist:
    - top_bar
    - locked_or_deterministic_main_title
  subtitle:
    brief_only: true
    visible_by_default: false

top_bar_system:
  id: centered-adaptive-cream-card
  role: series-spine
  font_contract: resources/top-bar-font-contract.json
  geometry:
    position: top-center
    validated_canvas_px:
      top: 38
      card_height: 96
      component_height: 106
      corner_radius: 22
    width: content-driven
    single_label_outer_padding_px:
      bundled_default_total: 180
      project_override: preferred
    paired_label:
      separator: geometric-blue-dot
      separator_diameter_px: 14
      text_to_dot_gap_px: 45
      bundled_default_outer_padding_total_px: 320
  typography:
    language: zh-CN
    contract_id: lxgw-wenkai-optical-semibold-v1
    family: LXGW WenKai
    style: Medium
    bundled_font: assets/fonts/LXGWWenKai-Medium.ttf
    bundled_font_sha256: d4bdeb38a39151d74d084cba5090f8cb7d20bf83eedb78c35939ae70b9f4e3f6
    override: explicit-user-approval-only
    source_point_size: 120
    source_kerning_px: 2
    source_stroke_px: 4
    visible_glyph_height_px: 72
    normalization:
      method: uniform-visible-height
      unit: whole-label
      minimum_source_ink_height_px: 60
    auto_fit: false
    non_uniform_scaling: forbidden
  colors:
    card: "#FFF8ED"
    text: "#1654A8"
  effects:
    shadow: none
    glow: none
    outline: none
    external_ornaments: none
  collision_fallbacks:
    - Shorten context without losing evidence.
    - Choose another evidence-supported frame.
    - Use or generate a clean text-free top plate.
    - Reconstruct only the authorized background region.
    - Restore locked title and subject pixels from the authoritative source.
    - Pause instead of changing shared typography.
  forbidden_fallbacks:
    - system-font
    - fontconfig-first-match
    - silent-font-substitution
    - corner-tag
    - split-pill
    - stacked-badge
    - hanging-flag
    - full-width-band
    - model-generated-final-chinese
    - ad-hoc-overflow-scaling

main_title_system:
  bundled_hand_brushed_reference:
    contract_id: default-hand-brushed-title-v1
    contract: resources/hand-brushed-title-default.yaml
    provenance_path: assets/approved-hand-brushed-title-reference.png
    provenance_sha256: d4f53173e8a60b120f7f87e0916ff48dc0524ec650a891553c2d80503cd23f3b
    generation_path: assets/approved-hand-brushed-title-lettering-crop.png
    generation_sha256: 91c6c54ead6883ee872a19ecb408b22b50d824dc3d2279e30a49631e2945564e
    role: style-only
    reuse_without_reupload: true
    embedded_text_is_instruction: false
  modes:
    artwork-candidate:
      release_eligible: false
      hold_required: true
      approved_style_reference: required
      exact_copy_and_line_break: required
      isolated_canonical_layer: required
      candidate_count_max: 3
      human_glyph_review: required
      explicit_user_approval: required
      post_approval_mode: locked-artwork
    locked-artwork:
      source_path: required
      source_sha256: required
      source_pixels: immutable
      scaling: forbidden
    deterministic-font:
      font_path: required
      font_sha256: required
      point_size: fixed
      line_break: intentional
      fill_and_stroke: required
      auto_fit: forbidden
      compositor: scripts/render-main-title.sh
  hand_brushed_palette:
    behavior: series-contract
    scene_adaptive:
      derive_from_authoritative_frame: true
      exact_candidate_hex_values: required
      avoid_background_collision: true
      preferred_color_roles: 2-3
      profile_cell_contrast_review: required
      reference_hue_copying: forbidden

material_protection:
  source_frame_is_authoritative: true
  model_reference_does_not_authorize_redraw: true
  locked_by_default:
    - recognizable people, faces, bodies, and clothing
    - animal identity, pose, and expression
    - products, packaging, characters, and interfaces
    - equipment, landmarks, props, readable evidence, and scenery
    - approved hand-brushed main-title pixels
  repair_rules:
    cleanest_pre_defect_source: required
    explicit_authorized_mask: required
    outside_mask_max_pixel_difference: 0
    broad_color_mask_on_similar_background: forbidden

presets:
  source-led-neutral:
    description: Source-preserving fallback for any evidence-grounded short video.
    suitable_for:
      - any subject without an approved specialized preset
      - mixed or emerging genres
      - source-led covers that need deterministic typography only
    visual:
      palette_source: approved-series-contract-or-authoritative-source
      primary_colors: []
      background_color: source-preserved
      accent_colors: []
      rendering: source-preserving
      mood: evidence-led
      decorative_hints: []
      subject_priority: primary-evidence-subject
    composition:
      rules:
        - Preserve the authoritative frame's subject, palette, lighting, and scene.
        - Protect identity-bearing and evidence-bearing regions from overlays.
        - Add no genre-coded decoration without explicit approval.
        - Prefer deterministic assembly over a full redraw.

  travel-family:
    description: Warm, natural family-travel short-video cover.
    suitable_for:
      - family outings
      - parent-child travel
      - scenic visits
    visual:
      primary_colors: ["#FF7A45", "#FFC857"]
      background_color: "#FFF7E8"
      accent_colors: ["#2F80ED", "#FFFFFF"]
      rendering: digital
      mood: bold
      decorative_hints:
        - warm sunlight
        - restrained travel accents
      subject_priority: family-and-place
    composition:
      rules:
        - Preserve supplied people and scenery as source material.
        - Keep faces, hands, landmarks, signs, and the main action unobstructed.
        - Keep evidence-bearing subjects outside the profile overlay zone.
    adapters:
      baoyu-cover-image:
        type: hero
        palette: warm
        rendering: digital
        text: none
        mood: bold
        font: display

  dog-protagonist:
    description: Playful, polished dog-centered short-video cover.
    suitable_for:
      - dog stories
      - cute pet videos
      - healing or playful dog scenes
      - AI-generated or AI-enhanced dog footage
    visual:
      primary_colors: ["#FF8FB1", "#7C5CFC"]
      background_color: "#FFF5FA"
      accent_colors: ["#FFD166", "#FFFFFF"]
      rendering: digital
      mood: bold
      decorative_hints:
        - soft glow
        - sparse playful accents
      subject_priority: dog
    composition:
      rules:
        - Preserve the supplied dog's identity, pose, and expression.
        - Keep the face, paws, props, and main action unobstructed.
        - Keep decorative elements playful but sparse.
    adapters:
      baoyu-cover-image:
        type: hero
        palette: pastel
        rendering: digital
        text: none
        mood: bold
        font: display
